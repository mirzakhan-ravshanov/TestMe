[build]
  command = "mkdir -p dist/assets && cp index.html app.js style.css brand.css dist/ && cp assets/testme-logo.png assets/favicon.png dist/assets/"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
